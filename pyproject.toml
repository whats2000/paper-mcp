[project]
name = "paper-mcp"
version = "0.1.0"
description = "Stateless MCP service for paper acquisition, extraction, and LaTeX compilation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.2",
    "httpx>=0.27",
    "arxiv>=2.1",
    "pydantic>=2.9",
]

[project.scripts]
paper-mcp = "paper_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The default run is fast and offline. Integration tests spawn a real server
# and are opt-in via `-m integration`; the `network` subset also reaches real
# arXiv / Semantic Scholar.
addopts = "-m 'not integration'"
markers = [
    "integration: spawns a real paper-mcp process and drives it with an MCP client",
    "network: reaches real external APIs (arXiv, Semantic Scholar, Unpaywall)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

# `arxiv` ships no py.typed marker. Scoped to that one module so strict mode
# still applies everywhere else; `_to_result` narrows its values explicitly.
[[tool.mypy.overrides]]
module = ["arxiv.*"]
ignore_missing_imports = true
